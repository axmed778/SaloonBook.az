name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build/typecheck never open real connections (Prisma connects lazily,
      # Redis/queue are lazy by design) — placeholders keep module init happy.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # schema.prisma declares `directUrl = env("DIRECT_URL")`. Nothing in CI
      # migrates, but `prisma generate` (postinstall) reads the datasource block,
      # so the variable has to exist. Same placeholder — no pooled/direct split
      # on a non-Neon URL.
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
      APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before typecheck on purpose: lint is the cheapest of the three checks
      # (no TS program, no bundling), so a lint-only mistake fails in seconds
      # instead of after a full typecheck+build.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── End-to-end smoke (Playwright) ──────────────────────────────────────
  # Boots a production build against a real Postgres and drives a real browser
  # through the two flows that must never break: the public booking page (the
  # link every salon shares with its customers) and the login form's rejection
  # of bad credentials.
  #
  # SOFT GATE — continue-on-error is deliberate, not an oversight.
  # This job was authored without a database available to validate it against,
  # so its seeding/boot sequence is unproven end-to-end. A required job that is
  # red for infrastructure reasons trains everyone to ignore CI, which is worse
  # than no gate at all. The failures are still visible in the run summary.
  # OWNER TODO: once this has passed green a few times on main, delete the
  # `continue-on-error: true` line below to make it a hard gate.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/e2e"
      # This job migrates, and schema.prisma routes migrations through
      # `directUrl = env("DIRECT_URL")` — same reasoning as the `rls` job below.
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/e2e"
      # No Redis service: rate limiting fails open (src/lib/ratelimit.ts) and
      # enqueueing is time-bounded and best-effort, so the app serves without it.
      REDIS_URL: "redis://localhost:6379"
      APP_URL: "http://127.0.0.1:3000"
      # Throwaway credentials for a database that is destroyed with the runner.
      # prisma/seed.ts refuses to invent passwords, and they must satisfy the
      # signup policy (8+ chars, upper/lower/digit/special).
      SEED_ADMIN_PASSWORD: "Ci-E2e-Throwaway-1!"
      SEED_OWNER_PASSWORD: "Ci-E2e-Throwaway-2!"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the suite declares a single chromium project, and
      # downloading Firefox/WebKit would triple the slowest step for nothing.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate and constrain
        run: pnpm db:setup

      # Creates the 'demostudio' salon the booking spec reads (e2e/fixtures.ts).
      - name: Seed fixtures
        run: pnpm db:seed

      # playwright.config.ts owns the webServer (`pnpm build && pnpm start`), so
      # there is no separate build step here — one place decides how the app
      # under test is started, locally and in CI alike.
      - name: Run smoke suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.artifacts/report
          retention-days: 7
          if-no-files-found: ignore

  # ── Dependency vulnerability scan ─────────────────────────────────────────
  # A separate job on purpose: a red audit must not mask — or be masked by — a
  # real typecheck/test/build failure, and it fails for a completely different
  # reason (an upstream advisory landed) than the `ci` job does.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm (corepack)
        run: corepack enable

      # `pnpm audit` resolves advisories from pnpm-lock.yaml alone — it never
      # reads node_modules — so this job needs no `pnpm install`, and therefore
      # no postinstall `prisma generate` and no DATABASE_URL/REDIS_URL stubs.
      #
      # Gate on `critical` only. Some current prod "high" advisories are pinned
      # inside Next.js itself (it pins postcss to exactly "8.4.31" and sharp to
      # "^0.34.3"), so `--audit-level=high` would leave CI permanently red for
      # reasons nobody here can act on — which just trains everyone to ignore
      # it. Raise this to `high` once those clear upstream; the allowlist
      # mechanism is `pnpm.auditConfig.ignoreGhsas` in package.json.
      #
      # `--audit-level` gates the exit code only — the full count still prints.
      # NEVER add `--json` here: in JSON mode pnpm ignores `--audit-level` and
      # exits 1 on any vulnerability at all.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical --ignore-registry-errors

      # The full moderate-and-above picture, non-blocking, for the run log.
      - name: Audit report (non-blocking)
        if: always()
        run: pnpm audit --prod --audit-level=moderate --ignore-registry-errors || true

  # ── Tenant isolation (RLS) ────────────────────────────────────────────────
  # The `ci` job never connects to a database (it uses a placeholder
  # DATABASE_URL), so nothing there can detect an RLS regression. This job
  # stands up a real Postgres, applies the security SQL, and proves isolation
  # against a role that genuinely lacks BYPASSRLS.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rlstest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rlstest"
      # This job actually migrates (`pnpm db:setup` -> `prisma migrate deploy`),
      # and schema.prisma routes migrations through `directUrl = env("DIRECT_URL")`.
      # Prisma validates the datasource block before it connects, so an unset
      # DIRECT_URL fails the whole job with P1012 rather than anything RLS-related.
      # A plain Postgres has no pooled/direct split — same value as DATABASE_URL.
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/rlstest"
      REDIS_URL: "redis://localhost:6379"
      APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Named salonbook_app so the file under test is byte-identical to the one
      # applied in production — rls-grants.sql keys the strict switch on that
      # exact role name.
      - name: Create the restricted app role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE salonbook_app LOGIN PASSWORD 'rlstest' NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;"

      - name: Migrate, constrain, grant
        run: pnpm db:setup

      - name: Apply RLS policies
        run: pnpm db:rls

      - name: Prove tenant isolation
        env:
          RLS_TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rlstest"
          RLS_TEST_APP_DATABASE_URL: "postgresql://salonbook_app:rlstest@localhost:5432/rlstest"
        run: pnpm test:rls
