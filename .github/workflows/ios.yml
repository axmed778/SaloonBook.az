name: iOS (TestFlight)

# Builds the App Store app (Capacitor shell in ios/, see capacitor.config.ts) on
# a GitHub-hosted Mac and uploads it to App Store Connect, where it appears in
# TestFlight. Run by hand from the Actions tab; nobody needs a Mac.
#
# Signing is automatic: Xcode uses the App Store Connect API key below to create
# the certificate and provisioning profile (and register the bundle id with the
# Push Notifications capability) on first run.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Apple Developer team id (10 characters, Membership page)
#   ASC_KEY_ID      App Store Connect API key id (Users and Access → Integrations)
#   ASC_ISSUER_ID   the issuer id shown above that key list
#   ASC_KEY_P8      the downloaded AuthKey_XXXX.p8 file's full contents
# The key needs the Admin role: only Admin keys may create distribution
# certificates through cloud signing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # postinstall runs `prisma generate`, which reads these; nothing connects.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # App Store uploads must be built with a current Xcode/iOS SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sync Capacitor into the Xcode project
        run: pnpm exec cap sync ios

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secret ASC_KEY_P8 is not set (see the header of this workflow)."
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
